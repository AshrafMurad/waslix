services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: waslix
      POSTGRES_PASSWORD: waslix
      POSTGRES_USER: waslix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waslix -d waslix"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - waslix-postgres:/var/lib/postgresql/data

volumes:
  waslix-postgres:
